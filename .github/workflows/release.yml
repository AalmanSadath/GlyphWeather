# Builds a signed release APK and publishes it as a GitHub Release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match versionName in app/build.gradle.kts. Signing uses four repository secrets:
# GLYPHWEATHER_KEYSTORE_BASE64, GLYPHWEATHER_KEYSTORE_PASSWORD, GLYPHWEATHER_KEY_ALIAS and
# GLYPHWEATHER_KEY_PASSWORD. Third-party actions are pinned to commits because this job can read
# the signing key.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check tag matches versionName
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GLYPHWEATHER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret GLYPHWEATHER_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          GLYPHWEATHER_KEYSTORE: ${{ runner.temp }}/release.jks
          GLYPHWEATHER_KEYSTORE_PASSWORD: ${{ secrets.GLYPHWEATHER_KEYSTORE_PASSWORD }}
          GLYPHWEATHER_KEY_ALIAS: ${{ secrets.GLYPHWEATHER_KEY_ALIAS }}
          GLYPHWEATHER_KEY_PASSWORD: ${{ secrets.GLYPHWEATHER_KEY_PASSWORD }}
        run: ./gradlew :icons:test :weather:test :app:assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the APK and print its signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK was produced; check the signing secrets"
            exit 1
          fi
          out="GlyphWeather-$GITHUB_REF_NAME.apk"
          cp "$apk" "$out"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$out" | grep 'SHA-256'
          sha256sum "$out" > "$out.sha256"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            GlyphWeather-${{ github.ref_name }}.apk
            GlyphWeather-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
